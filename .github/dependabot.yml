version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/images/agent", "/images/git-bridge"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /images/agent/mcp
      - /images/agent/providers/opencode
      - /images/agent/providers/gemini-cli
      - /images/agent/providers/codex
    schedule:
      interval: weekly
    groups:
      sandbox-dependencies:
        patterns: ["*"]
