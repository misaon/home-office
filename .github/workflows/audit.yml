name: audit

# `check` audits dependencies on every pull request, which catches a bad dependency as it arrives but says
# nothing about `main` between pull requests. Advisories are published against versions that are already
# merged, so the same audit runs daily against the default branch.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit
      - name: Audit sandbox dependencies
        run: |
          for directory in images/agent/mcp images/agent/providers/*; do
            npm ls --prefix "$directory" --package-lock-only >/dev/null
            npm audit --omit=dev --prefix "$directory"
          done
