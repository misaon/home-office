name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The desktop app typechecks against the Electrobun devkit Hutch projects into apps/desktop/.hutch;
      # without it scripts/typecheck.ts skips that workspace silently.
      - name: Install Hutch and project the Electrobun devkit
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version 0.25.0 --no-modify-path
          cd apps/desktop && "$HOME/.hutch/bin/hutch" electrobun sync
      - run: bun run check
