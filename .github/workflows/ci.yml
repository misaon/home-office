name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run devkit
      - run: bun run check
      - run: bun audit
      - name: Audit sandbox dependencies
        run: |
          for directory in images/agent/mcp images/agent/providers/*; do
            npm audit --omit=dev --prefix "$directory"
          done
      - run: bun run ui:build
      - run: bun run assets:manifest
      - run: bun build --compile apps/cli/src/main.ts --outfile /tmp/ho
      - run: bun build --compile --minify --target=bun-linux-arm64-musl packages/runner/src/main.ts --outfile /tmp/ho-runner
