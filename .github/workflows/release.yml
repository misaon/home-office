name: release

# Tag a commit on main as vX.Y.Z and push the tag: the desktop app is built on an Apple Silicon runner and
# attached to a GitHub Release together with SHA-256 checksums. Builds are unsigned (no Apple developer
# account, decision in docs/STACK.md); the release notes explain the one-time `xattr -cr`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop-macos:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HUTCH_VERSION: "0.25.0"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Hutch and project the Electrobun devkit
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version "$HUTCH_VERSION" --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
          cd apps/desktop && "$HOME/.hutch/bin/hutch" electrobun sync
      - run: bun run check
      - name: Stamp the app version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^    version: \".*\",/    version: \"${VERSION}\",/" apps/desktop/electrobun.config.ts
          grep -n "version:" apps/desktop/electrobun.config.ts
      - name: Build the desktop app
        run: bun run desktop:build
      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          for f in apps/desktop/artifacts/*; do
            cp "$f" "dist/$(basename "$f" | tr ' ' '-')"
          done
          cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Home Office for macOS (Apple Silicon)

          Unsigned build. After downloading, clear the quarantine flag once, then open the app normally:

          ```bash
          xattr -cr "/Applications/Home Office.app"
          ```

          Requirements: macOS 14+, Docker Desktop running, a Claude subscription (`claude setup-token`).
          The first launch opens a setup checklist that builds the agent image, stores the token in the
          Keychain, hires the default team and runs a smoke test.

          Files: the `.dmg` installs the app; the `.app.tar.zst` and `update.json` serve Electrobun's
          updater; `SHA256SUMS.txt` lists the checksums.
          NOTES
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Home Office $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
