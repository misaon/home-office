name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "HO_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # This job produces the binaries people download, and an Actions cache written from any branch can be
      # read here. `bun run devkit` verifies the SHA-256 of the toolchain it downloads, but it skips the
      # download entirely when `.tools` already holds the binary, so a restored cache would be executed
      # unchecked. The release therefore restores nothing and pays for the downloads every time.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run devkit
      - run: bun run check
      - run: bun audit
      - run: bun run desktop:build
      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          for artifact in apps/desktop/artifacts/*; do
            cp "$artifact" "dist/$(basename "$artifact" | tr ' ' '-')"
          done
          cd dist
          shasum -a 256 ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: desktop-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads the files
      id-token: write # signs the provenance statement for them
      attestations: write # records it against this repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-macos
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          ## Home Office for macOS (Apple Silicon)

          Requirements: macOS 14+, Docker Desktop, and credentials for the chosen AI provider.
          Claude Code is the default provider; other provider images can be built in Settings.
          The setup checklist builds the required images, stores provider credentials in the
          system secret store, and can run a task to verify the office.

          Every file below carries a build provenance attestation, so you can confirm it came out
          of this repository and this workflow instead of comparing a checksum by hand:

          ```bash
          gh attestation verify macos-arm64-HomeOffice.dmg --repo misaon/home-office
          ```

          This build carries an ad-hoc signature, not an Apple Developer ID, so macOS will not
          recognise the developer. After verifying the download, drag the app to Applications
          and clear the quarantine flag it was downloaded with:

          ```bash
          xattr -cr "/Applications/Home Office.app"
          ```

          Right-clicking the app and choosing Open works too. If macOS instead says the app is
          *damaged*, the bundle was not sealed — that was true of v0.0.1 and is fixed from v0.0.2.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Home Office $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
