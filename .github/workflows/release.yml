name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "HO_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run devkit
      - run: bun run check
      - run: bun audit
      - run: bun run desktop:build
      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          for artifact in apps/desktop/artifacts/*; do
            cp "$artifact" "dist/$(basename "$artifact" | tr ' ' '-')"
          done
          cd dist
          shasum -a 256 ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: desktop-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-macos
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          ## Home Office for macOS (Apple Silicon)

          Requirements: macOS 14+, Docker Desktop, and credentials for the chosen AI provider.
          Claude Code is the default provider; other provider images can be built in Settings.
          The setup checklist builds the required images, stores provider credentials in the
          system secret store, and can run a task to verify the office.

          This build is unsigned. After verifying SHA256SUMS.txt, clear the quarantine flag
          on the installed application if macOS blocks it:

          ```bash
          xattr -cr "/Applications/Home Office.app"
          ```
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Home Office $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
